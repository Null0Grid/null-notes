name: Release

# Push a tag that matches the app version (src-tauri/tauri.conf.json), with
# or without a "v": v5.0.1 or 5.0.1. Or, for a tag that already exists:
# Actions → Release → Run workflow, and type the tag.
# Builds the Linux packages (AppImage, .rpm, .tar.gz, .deb), the Windows installers and the Microsoft Store package and
# attaches them to the release for that tag (an existing release keeps its
# published/draft state; a new one is published).
# The .msix is a workflow artifact only: it's unsigned and meant for Partner
# Center, which signs it.

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. 5.0.0)"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${TAG#v}"
          if [ "$app" != "$tag" ]; then echo "::error::tag $TAG but tauri.conf.json says $app"; exit 1; fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages (AppImage, .rpm, .tar.gz, .deb)
    needs: version
    runs-on: ubuntu-22.04   # glibc 2.35: the oldest distro the packages support
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev build-essential \
            librsvg2-dev patchelf file rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build packages
        run: packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: packaging/linux/dist/*

  windows:
    name: Windows installers + Store package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build installers (NSIS + MSI)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Build Store package (MSIX)
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: packaging/msix/*.msix

  release:
    name: Attach to the GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          name: Null Notes ${{ needs.version.outputs.version }}
          files: |
            dist/linux/*
            dist/windows/nsis/*.exe
            dist/windows/msi/*.msi
          body: |
            **Windows:** the `-setup.exe` installer (or the Microsoft Store).
            **Linux** (any distro from 2022 on: glibc 2.35+ and WebKitGTK 4.1):
            - **Any distro, no install:** the `.AppImage`. `chmod +x` it and run it.
            - **Ubuntu 22.04+ / Debian 12+ / Mint:** `sudo apt install ./null-notes_${{ needs.version.outputs.version }}_amd64.deb`
            - **Fedora / openSUSE / RHEL 9+:** `sudo dnf install ./null-notes-${{ needs.version.outputs.version }}-1.x86_64.rpm` (openSUSE: `sudo zypper install ./…rpm`)
            - **Anything else:** the `.tar.gz`. Unpack it and run `./null-notes`, or `./install.sh` to add it to your app menu.

            The Microsoft Store package is in this run's `store-package` artifact (upload it in Partner Center).
