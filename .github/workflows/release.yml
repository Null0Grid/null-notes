name: Release

# Push a tag that matches the app version (src-tauri/tauri.conf.json), with
# or without a "v": v5.0.1 or 5.0.1. Or, for a tag that already exists:
# Actions → Release → Run workflow, and type the tag.
# Builds every Linux package for x86_64 and ARM64 (linux-packages.yml), the Windows installers and the Microsoft Store package and
# attaches them to the release for that tag (an existing release keeps its
# published/draft state; a new one is published).
# The .msix is a workflow artifact only: it's unsigned and meant for Partner
# Center, which signs it.

on:
  push:
    tags: ["v*", "[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. 5.0.0)"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  version:
    name: Check tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${TAG#v}"
          if [ "$app" != "$tag" ]; then echo "::error::tag $TAG but tauri.conf.json says $app"; exit 1; fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: version
    uses: ./.github/workflows/linux-packages.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  windows:
    name: Windows installers + Store package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build installers (NSIS + MSI)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Build Store package (MSIX)
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: packaging/msix/*.msix

  release:
    name: Attach to the GitHub release
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect the files
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p out
          cp art/linux-x86_64/* art/linux-aarch64/* out/
          cp art/flatpak-x86_64/null-notes-x86_64.flatpak "out/null-notes-$v-x86_64.flatpak"
          cp art/flatpak-aarch64/null-notes-aarch64.flatpak "out/null-notes-$v-aarch64.flatpak"
          cp art/windows/nsis/*.exe art/windows/msi/*.msi out/
          # AUR: PKGBUILD as is, and both files together (GitHub drops the dot from ".SRCINFO")
          cp art/aur/PKGBUILD out/PKGBUILD
          tar -C art/aur -czf "out/null-notes-bin-$v-aur.tar.gz" PKGBUILD .SRCINFO
          # Flathub: the manifest built from this tag, and its crate list
          commit="$(git rev-parse HEAD)"
          python3 - "$v" "$commit" <<'PY'
          import re, sys
          v, commit = sys.argv[1], sys.argv[2]
          m = open("packaging/flatpak/dev.nullgrid.notes.yml").read()
          git = (f"      - type: git\n        url: https://github.com/Null0Grid/null-notes.git\n"
                 f"        tag: \"{v}\"\n        commit: {commit}\n")
          m, n = re.subn(r"      # @SOURCE@.*?\n      - type: dir\n(?:        .*\n|          .*\n)*", git, m)
          assert n == 1, "dir source not found"
          open("out/dev.nullgrid.notes.yml", "w").write(m)
          PY
          cp art/flatpak-sources/cargo-sources.json out/cargo-sources.json
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          name: Null Notes ${{ needs.version.outputs.version }}
          files: out/*
          body: |
            **Windows:** the `-setup.exe` installer (or the Microsoft Store).

            **Linux**, for x86_64 and ARM64 (aarch64). Pick your machine's architecture; any distro from 2022 on (glibc 2.35+):
            - **Any distro, no install:** the `.AppImage`. `chmod +x` it and run it.
            - **Flatpak** (also the way for RHEL, Rocky and Alma): `flatpak install ./null-notes-${{ needs.version.outputs.version }}-x86_64.flatpak` (needs the Flathub remote)
            - **Snap:** `sudo snap install --dangerous ./null-notes_${{ needs.version.outputs.version }}_amd64.snap`
            - **Ubuntu 22.04+ / Debian 12+ / Mint / Raspberry Pi OS:** `sudo apt install ./null-notes_${{ needs.version.outputs.version }}_amd64.deb` (ARM: `_arm64.deb`)
            - **Fedora / openSUSE:** `sudo dnf install ./null-notes-${{ needs.version.outputs.version }}-1.x86_64.rpm` (openSUSE: `sudo zypper install ./…rpm`; ARM: `.aarch64.rpm`)
            - **Arch:** the AUR package `null-notes-bin` (its `PKGBUILD` is attached here too)
            - **Anything else:** the `.tar.gz`. Unpack it and run `./null-notes`, or `./install.sh` to add it to your app menu.

            Check a download: `sha256sum -c SHA256SUMS --ignore-missing`

            The Microsoft Store package is in this run's `store-package` artifact (upload it in Partner Center). For Flathub, `dev.nullgrid.notes.yml` and `cargo-sources.json` are the submission files.
