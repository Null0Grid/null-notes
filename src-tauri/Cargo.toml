[package]
name = "null-notes"
version = "5.1.0"
description = "Null Notes - a local markdown vault"
authors = ["Luke"]
edition = "2021"

[lib]
name = "null_notes_lib"
crate-type = ["rlib"]  # desktop only; add "staticlib", "cdylib" back for mobile builds

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
trash = "5"
zeroize = "1"
# Phase 1: cross-product search
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
filetime = "0.2"
# Phase 5: nullnotes:// links
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Phase 6: back up to Null Drive
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
sha2 = "0.10"
# Phase 8: encrypted Drive accounts
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
